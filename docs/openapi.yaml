openapi: 3.0.3
info:
  title: Dynamic Pricing & Promotion Engine API
  version: 2.1.0
  description: |
    API REST del motor de precios dinamicos. Todos los importes son enteros en centavos.
    Los precios de los productos los resuelve siempre el servidor desde el catalogo; el cliente
    solo envia `sku` y `quantity`. Las respuestas exitosas usan el sobre `{ "data": ... }` y los
    errores `{ "error": { "code", "message", "details?" } }`.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Catalog
  - name: Pricing
  - name: Coupons
  - name: Campaigns
  - name: Orders
  - name: Admin
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current principal (sub, role and stored tier)
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sub: { type: string }
                      role: { type: string, enum: [customer, admin] }
                      tier: { type: string, enum: [standard, gold, platinum] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /catalog:
    get:
      tags: [Catalog]
      summary: Active products, sorted by sku
      responses:
        '200':
          description: Active catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /pricing/calculate:
    post:
      tags: [Pricing]
      summary: Calculate a cart, optionally reserving a coupon
      description: |
        Prices are resolved from the catalog. When `couponCode` is present the coupon
        reservation and the audit write happen in one transaction, and the request counts
        against the per-subject coupon rate limit (429 RATE_LIMITED). Only one active coupon
        per cart is allowed; calling again with the SAME code on the same cart releases the old
        reservation and issues a fresh one atomically (no extra use is consumed), while a
        DIFFERENT code gives 409 COUPON_ALREADY_APPLIED. `context.customerTier` sent by the
        client is ignored: the tier is read from the user record. `delivery` adds `shipping`
        and `grandTotal` to the response and `shipping` to the checksummed audit snapshot. The coupon block of an audit is valid only while its reservation
        is active (RESERVED and not expired); releasing or expiring the reservation does not
        alter the audit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateRequest' }
      responses:
        '200':
          description: Calculation result with audit id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CalculateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: COUPON_NOT_FOUND (unknown code or coupon bound to another user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            COUPON_UNAVAILABLE, COUPON_EXHAUSTED, COUPON_LIMIT_REACHED or COUPON_ALREADY_APPLIED
            (the cart already holds an active coupon with a different code)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            UNKNOWN_SKU (details.skus), CURRENCY_MISMATCH (product or coupon currency differs
            from the cart), MIN_SUBTOTAL_NOT_MET, AMOUNT_TOO_LARGE or
            SHIPPING_UNSUPPORTED_CURRENCY (delivery with a currency other than USD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /pricing/audit/{auditId}:
    get:
      tags: [Pricing]
      summary: Get an audit snapshot (owner only)
      parameters:
        - { $ref: '#/components/parameters/AuditId' }
      responses:
        '200':
          description: Audit snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Audit' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /campaigns/active:
    get:
      tags: [Campaigns]
      summary: Active campaigns for the caller's tier (safe fields only, max 5, percentage first then fixed, value desc)
      responses:
        '200':
          description: Active campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 5
                    items: { $ref: '#/components/schemas/PublicCampaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders:
    post:
      tags: [Orders]
      summary: Place a demo order from a quoted audit (no payment is taken)
      description: |
        Every amount comes from re-pricing the audit's SKUs on the server; the body only carries
        the audit id, contact and address. Card fields are rejected (400 VALIDATION_ERROR).
        The coupon reservation, if any, becomes CONSUMED in the same transaction that creates
        the order. Idempotent per audit: repeating the request returns 200 with the same order.
        Limited per subject (429 RATE_LIMITED). An active reservation on the audit that the quote
        does not record (for example one made later through POST /coupons/apply) gives
        409 COUPON_RESERVATION_INVALID, so the client must recalculate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '200':
          description: Idempotent replay of an existing order for the audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            AUDIT_STALE (quote older than AUDIT_QUOTE_TTL_SECONDS), PRICE_CHANGED (re-pricing
            differs from the quote) or COUPON_RESERVATION_INVALID (released, expired or consumed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            DELIVERY_REQUIRED (the audit has no shipping), REGION_MISMATCH or UNKNOWN_SKU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /coupons/apply:
    post:
      tags: [Coupons]
      summary: Reserve a coupon against an owned audit
      description: >-
        The subtotal is the audit result.total and the cart is the audit cartId; neither can be
        sent by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, auditId]
              additionalProperties: false
              properties:
                code: { type: string }
                auditId: { type: string, format: uuid }
      responses:
        '201':
          description: Coupon reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ApplyResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: AUDIT_NOT_FOUND or COUPON_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            COUPON_UNAVAILABLE, COUPON_EXHAUSTED, COUPON_LIMIT_REACHED, COUPON_ALREADY_APPLIED
            (the audit or its cart already holds an active coupon) or AUDIT_STALE (the audit is
            older than AUDIT_QUOTE_TTL_SECONDS, default 900; recalculate the cart)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: MIN_SUBTOTAL_NOT_MET or CURRENCY_MISMATCH (coupon currency differs from the audit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /coupons/reservations/{id}:
    delete:
      tags: [Coupons]
      summary: Release an active reservation (restores exactly one use)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
      responses:
        '200':
          description: Reservation released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [RELEASED] }
                      reservationId: { type: string }
                      remainingUses: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: RESERVATION_NOT_FOUND (unknown or owned by another user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: RESERVATION_NOT_ACTIVE (already released)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /admin/products:
    get:
      tags: [Admin]
      summary: List all products, including inactive ones
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProduct' }
      responses:
        '201':
          description: Product created (sku uppercased)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: PRODUCT_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ImageUrlNotAllowed' }
  /admin/products/{sku}:
    patch:
      tags: [Admin]
      summary: Update a product (strict, non-empty subset)
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProduct' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: PRODUCT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ImageUrlNotAllowed' }
  /admin/campaigns:
    get:
      tags: [Admin]
      summary: List campaigns
      responses:
        '200': { $ref: '#/components/responses/DataList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Campaign' }
      responses:
        '201': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/campaigns/{code}:
    patch:
      tags: [Admin]
      summary: Update a campaign
      parameters:
        - { $ref: '#/components/parameters/Code' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/campaigns/{code}/regions/{region}:
    put:
      tags: [Admin]
      summary: Add a region to a campaign
      parameters:
        - { $ref: '#/components/parameters/Code' }
        - { $ref: '#/components/parameters/Region' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Remove a region from a campaign (the last region is protected, LAST_REGION)
      parameters:
        - { $ref: '#/components/parameters/Code' }
        - { $ref: '#/components/parameters/Region' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/regions:
    get:
      tags: [Admin]
      summary: Campaigns grouped by region
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/coupons:
    get:
      tags: [Admin]
      summary: List coupons
      responses:
        '200': { $ref: '#/components/responses/DataList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a coupon (optionally bound to a user, with perUserLimit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Coupon' }
      responses:
        '201': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/coupons/{code}:
    patch:
      tags: [Admin]
      summary: Update isActive, expiresAt, minSubtotal, currency or perUserLimit of a coupon
      parameters:
        - { $ref: '#/components/parameters/Code' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                isActive: { type: boolean }
                expiresAt: { type: string, format: date-time }
                minSubtotal: { type: integer, minimum: 0 }
                currency: { type: string, pattern: '^[A-Za-z]{3}$' }
                perUserLimit: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: COUPON_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/audits:
    get:
      tags: [Admin]
      summary: List audits (filter by userId or cartId)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: cartId, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/DataList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audits/export:
    get:
      tags: [Admin]
      summary: Export audits as JSON or CSV with checksumValid (EXPORT_TOO_LARGE above the limit)
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Audit rows
          content:
            application/json:
              schema:
                { type: object, properties: { data: { type: array, items: { type: object } } } }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: EXPORT_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/audits/{auditId}:
    get:
      tags: [Admin]
      summary: Get any audit with checksumValid recomputed on read
      parameters:
        - { $ref: '#/components/parameters/AuditId' }
      responses:
        '200': { $ref: '#/components/responses/DataObject' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AuditId:
      name: auditId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Code:
      name: code
      in: path
      required: true
      schema: { type: string }
    Region:
      name: region
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z]{2}$' }
  responses:
    ValidationError:
      description: VALIDATION_ERROR or INVALID_INPUT (malformed body, unknown or operator keys)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: AUTH_REQUIRED, INVALID_CREDENTIALS or an invalid or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: FORBIDDEN (role) or USER_MISMATCH
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (AUDIT_NOT_FOUND, CAMPAIGN_NOT_FOUND, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict (duplicate resource, LAST_REGION, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ImageUrlNotAllowed:
      description: IMAGE_URL_NOT_ALLOWED (host, path, scheme, credentials or port not accepted)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: RATE_LIMITED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DataObject:
      description: Successful response with a data object
      content:
        application/json:
          schema: { type: object, properties: { data: { type: object } } }
    DataList:
      description: Successful response with a data array
      content:
        application/json:
          schema: { type: object, properties: { data: { type: array, items: { type: object } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
    UserEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            role: { type: string, enum: [customer, admin] }
            tier: { type: string, enum: [standard, gold, platinum] }
    LoginEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn: { type: integer }
            user: { type: object }
    CatalogProduct:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        unitPrice: { type: integer, description: Cents }
        currency: { type: string }
        imageUrl:
          type: string
          description: Optional https://res.cloudinary.com/<cloud>/image/upload/... image; omitted when unset
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/CatalogProduct'
        - type: object
          properties:
            isActive: { type: boolean }
    CreateProduct:
      type: object
      required: [sku, name, category, unitPrice]
      additionalProperties: false
      properties:
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        unitPrice: { type: integer, minimum: 0, maximum: 1000000000 }
        currency:
          { type: string, pattern: '^[A-Za-z]{3}$', default: USD, description: Uppercased on input }
        isActive: { type: boolean, default: true }
        imageUrl: { $ref: '#/components/schemas/ImageUrlInput' }
    UpdateProduct:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string }
        category: { type: string }
        unitPrice: { type: integer, minimum: 0, maximum: 1000000000 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', description: Uppercased on input }
        isActive: { type: boolean }
        imageUrl:
          allOf: [{ $ref: '#/components/schemas/ImageUrlInput' }]
          nullable: true
          description: Empty string or null clears the image
    ImageUrlInput:
      type: string
      maxLength: 500
      description: >-
        https URL on host res.cloudinary.com whose path starts with /CLOUDINARY_CLOUD_NAME/image/upload/ (other delivery types such as /image/fetch/ are refused).
        Anything else (or any value while the variable is unset) gives 422 IMAGE_URL_NOT_ALLOWED.
    CartItemInput:
      type: object
      required: [sku, quantity]
      additionalProperties: false
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
    ResolvedItem:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        unitPrice: { type: integer }
        quantity: { type: integer }
    QuotedItem:
      allOf:
        - $ref: '#/components/schemas/ResolvedItem'
        - type: object
          properties:
            lineTotal: { type: integer, description: unitPrice * quantity, response only }
    ShippingOption:
      type: object
      properties:
        method: { type: string, enum: [standard, express] }
        label: { type: string }
        eta: { type: string }
        amount: { type: integer, description: Cents; 0 when free }
    NextThreshold:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        minSubtotal: { type: integer }
        remaining: { type: integer, minimum: 1 }
        progressPercent: { type: integer, minimum: 0, maximum: 99 }
    PricingContext:
      type: object
      properties:
        userId: { type: string }
        customerTier:
          {
            type: string,
            enum: [standard, gold, platinum],
            description: Ignored on input; stored tier is used,
          }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: USD }
        channel: { type: string }
        region: { type: string, pattern: '^[A-Za-z]{2}$' }
    CalculateRequest:
      type: object
      required: [cartId, items, context]
      properties:
        cartId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CartItemInput' }
        context: { $ref: '#/components/schemas/PricingContext' }
        couponCode: { type: string }
        delivery: { type: string, enum: [standard, express] }
    CouponReservation:
      type: object
      properties:
        code: { type: string }
        discountAmount: { type: integer }
        reservationId: { type: string }
        remainingUses: { type: integer }
        expiresAt: { type: string, format: date-time }
    CalculateResponse:
      type: object
      properties:
        auditId: { type: string, format: uuid }
        cartId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotedItem' }
        subtotal: { type: integer }
        appliedRules: { type: array, items: { type: object } }
        skippedRules: { type: array, items: { type: object } }
        totalDiscount: { type: integer }
        total: { type: integer }
        currency: { type: string }
        calculatedAt: { type: string, format: date-time }
        finalTotal: { type: integer, description: total minus the coupon discount }
        coupon: { $ref: '#/components/schemas/CouponReservation' }
        savings: { type: integer, description: totalDiscount plus the coupon discount }
        shippingOptions:
          type: array
          items: { $ref: '#/components/schemas/ShippingOption' }
        shipping:
          allOf: [{ $ref: '#/components/schemas/ShippingOption' }]
          description: Present only when delivery was sent
        grandTotal: { type: integer, description: finalTotal plus shipping; only with delivery }
        nextThreshold: { $ref: '#/components/schemas/NextThreshold' }
    PublicCampaign:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: integer, description: Percent number for percentage, cents for fixed }
        minSubtotal: { type: integer }
        endsAt: { type: string, format: date-time }
    CreateOrderRequest:
      type: object
      required: [auditId, contact, address]
      additionalProperties: false
      properties:
        auditId: { type: string, format: uuid }
        contact:
          type: object
          required: [email, fullName]
          additionalProperties: false
          properties:
            email: { type: string, format: email, maxLength: 254 }
            fullName: { type: string, minLength: 2, maxLength: 120 }
        address:
          type: object
          required: [street, city, postalCode, region]
          additionalProperties: false
          properties:
            street: { type: string, minLength: 3, maxLength: 200 }
            city: { type: string, minLength: 2, maxLength: 100 }
            postalCode: { type: string, minLength: 3, maxLength: 12, pattern: '^[A-Za-z0-9 -]+$' }
            region: { type: string, pattern: '^[A-Za-z]{2}$' }
    Order:
      type: object
      properties:
        orderNumber: { type: string, pattern: '^DP-[A-HJ-NP-Z2-9]{8}$' }
        status: { type: string, enum: [CONFIRMED] }
        payment: { type: string, enum: [DEMO_NOT_CHARGED] }
        items:
          type: array
          items: { $ref: '#/components/schemas/QuotedItem' }
        subtotal: { type: integer }
        totalDiscount: { type: integer }
        couponDiscount: { type: integer }
        savings: { type: integer }
        shipping: { $ref: '#/components/schemas/ShippingOption' }
        grandTotal: { type: integer }
        currency: { type: string }
        contact: { type: object }
        address: { type: object }
        coupon:
          type: object
          description: Present only when a coupon was used
          properties:
            code: { type: string }
            discountAmount: { type: integer }
        createdAt: { type: string, format: date-time }
    ApplyResponse:
      allOf:
        - $ref: '#/components/schemas/CouponReservation'
        - type: object
          properties:
            status: { type: string, enum: [RESERVED] }
            cartId: { type: string }
            auditId: { type: string }
            subtotal: { type: integer }
            newTotal: { type: integer }
    Audit:
      type: object
      properties:
        auditId: { type: string, format: uuid }
        cartId: { type: string }
        context: { $ref: '#/components/schemas/PricingContext' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ResolvedItem' }
        result: { type: object }
        coupon:
          type: object
          description: Present only when the audit was calculated with a coupon
          properties:
            code: { type: string }
            discountAmount: { type: integer }
            reservationId: { type: string }
            expiresAt: { type: string, format: date-time }
        shipping:
          allOf: [{ $ref: '#/components/schemas/ShippingOption' }]
          description: Present only when the audit was calculated with delivery
        checksum: { type: string }
        createdAt: { type: string, format: date-time }
    Campaign:
      type: object
      required: [code, name, type, value, startsAt, endsAt]
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: integer, minimum: 0 }
        priority: { type: integer }
        stackable: { type: boolean }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
        conditions: { type: object }
    Coupon:
      type: object
      required: [code, discountType, value, maxUses, expiresAt]
      properties:
        code: { type: string }
        discountType: { type: string, enum: [percentage, fixed] }
        value: { type: integer, minimum: 0 }
        maxUses: { type: integer, minimum: 1 }
        minSubtotal: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: USD }
        expiresAt: { type: string, format: date-time }
        isActive: { type: boolean }
        userId: { type: string }
        perUserLimit: { type: integer, minimum: 1, maximum: 1000, default: 1 }
